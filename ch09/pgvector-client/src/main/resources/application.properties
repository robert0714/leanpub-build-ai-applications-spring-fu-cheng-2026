server.port=8063
spring.application.name=docker-hub
spring.ai.openai.api-key=_
spring.ai.openai.chat.base-url=http://localhost:8180/
#spring.ai.openai.chat.completions-path=/v1/chat/completions 

# https://docs.spring.io/spring-ai/reference/api/chat/ollama-chat.html
spring.ai.ollama.base-url=http://localhost:8180
# spring.ai.ollama.chat.options.model=llama3
# spring.ai.ollama.chat.options.model=llava
# spring.ai.ollama.chat.options.model=qwen3:0.6b
# spring.ai.ollama.chat.options.model=hf.co/bartowski/gemma-2-2b-it-GGUF
# spring.ai.ollama.chat.options.model=mistral

# Embedding 模型設定
# nomic-embed-text: 維度 768, 適合 HNSW 索引 (限制 2000 維度)
# all-minilm: 維度 384
# phi3: 維度 3072 (超過 HNSW 限制，需使用 IVFFlat)
spring.ai.ollama.embedding.options.model=nomic-embed-text
# spring.ai.ollama.embedding.options.model=chroma/all-minilm-l6-v2-f32
# spring.ai.ollama.embedding.options.model=phi3
# spring.ai.ollama.embedding.options.model=hf.co/mixedbread-ai/mxbai-embed-large-v1

# PostgreSQL with PgVector 配置
# 本機執行時使用 localhost，Docker 環境使用 ollama-postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

# PgVector 設定
# index-type: HNSW 提供更好的查詢效能 (限制: 最多 2000 維度)
# 若使用高維度模型 (>2000)，請改用 IVFFlat
spring.ai.vectorstore.pgvector.index-type=HNSW
# 自動建立 schema（vector_store 表）
spring.ai.vectorstore.pgvector.initialize-schema=true
# 距離計算方式：COSINE_DISTANCE
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# dimensions 應與 embedding model 輸出維度一致
# nomic-embed-text 模型的 embedding 維度為 768
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.max-document-batch-size=10000

spring.ai.ollama.embedding.options.temperature=0.7
# spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.init.pull-model-strategy=when-missing
spring.ai.ollama.init.timeout=10m


spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB